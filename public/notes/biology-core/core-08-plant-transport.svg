<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transport in Plants — Xylem, Phloem, Water Uptake and Transpiration</title>
  <desc id="desc">Xylem and phloem distribution in root, stem and leaf sections; root hair pathway; transpiration evaporation and diffusion through stomata.</desc>
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#173128}.head{font:700 18px Arial,sans-serif;fill:#173128}.label{font:600 14px Arial,sans-serif;fill:#233831}.small{font:12px Arial,sans-serif;fill:#465a4d}.box{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}.line{stroke:#547365;stroke-width:2;fill:none}.xylem{fill:#f87171;stroke:#dc2626;stroke-width:2}.phloem{fill:#60a5fa;stroke:#2563eb;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="600" y="44" text-anchor="middle" class="title">Topic 8: Transport in Plants — Xylem, Phloem &amp; Water Pathway</text>

  <!-- Top panel: Dicot Root, Stem & Leaf Cross-sections (Core 8.1.2) -->
  <rect x="36" y="68" width="1128" height="300" rx="16" class="box"/>
  <text x="600" y="98" text-anchor="middle" class="head">Position of Xylem &amp; Phloem in Non-Woody Dicotyledonous Plants (Core 8.1.2)</text>
  <text x="600" y="118" text-anchor="middle" class="small">Red = Xylem (water, mineral ions &amp; support) · Blue = Phloem (sucrose &amp; amino acids)</text>

  <!-- 1. Dicot Root Section -->
  <g transform="translate(100, 140)">
    <circle cx="110" cy="90" r="80" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="110" cy="90" r="38" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Central Xylem cross/star -->
    <path d="M 110 65 L 110 115 M 85 90 L 135 90" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    <!-- Phloem bundles in the 4 corners of the star -->
    <circle cx="95" cy="75" r="7" class="phloem"/>
    <circle cx="125" cy="75" r="7" class="phloem"/>
    <circle cx="95" cy="105" r="7" class="phloem"/>
    <circle cx="125" cy="105" r="7" class="phloem"/>

    <text x="110" y="195" text-anchor="middle" class="head">1. Dicot Root</text>
    <text x="110" y="215" text-anchor="middle" class="small">Xylem forms central 'X'</text>
    <text x="110" y="230" text-anchor="middle" class="small">Phloem fits between arms</text>
  </g>

  <!-- 2. Dicot Stem Section -->
  <g transform="translate(480, 140)">
    <circle cx="110" cy="90" r="80" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="110" cy="90" r="50" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Ring of vascular bundles around perimeter -->
    <!-- 8 bundles: inner part xylem (red), outer part phloem (blue) -->
    <!-- Top bundle -->
    <path d="M 103 40 L 117 40 L 110 52 Z" class="xylem"/>
    <path d="M 103 38 L 117 38 L 110 26 Z" class="phloem"/>
    <!-- Bottom bundle -->
    <path d="M 103 140 L 117 140 L 110 128 Z" class="xylem"/>
    <path d="M 103 142 L 117 142 L 110 154 Z" class="phloem"/>
    <!-- Right bundle -->
    <path d="M 160 83 L 160 97 L 148 90 Z" class="xylem"/>
    <path d="M 162 83 L 162 97 L 174 90 Z" class="phloem"/>
    <!-- Left bundle -->
    <path d="M 60 83 L 60 97 L 72 90 Z" class="xylem"/>
    <path d="M 58 83 L 58 97 L 46 90 Z" class="phloem"/>
    <!-- 4 diagonals -->
    <circle cx="145" cy="55" r="7" class="phloem"/><circle cx="137" cy="63" r="7" class="xylem"/>
    <circle cx="75" cy="55" r="7" class="phloem"/><circle cx="83" cy="63" r="7" class="xylem"/>
    <circle cx="145" cy="125" r="7" class="phloem"/><circle cx="137" cy="117" r="7" class="xylem"/>
    <circle cx="75" cy="125" r="7" class="phloem"/><circle cx="83" cy="117" r="7" class="xylem"/>

    <text x="110" y="195" text-anchor="middle" class="head">2. Dicot Stem</text>
    <text x="110" y="215" text-anchor="middle" class="small">Bundles in an outer ring</text>
    <text x="110" y="230" text-anchor="middle" class="small">Xylem inside · Phloem outside</text>
  </g>

  <!-- 3. Dicot Leaf Vein Section -->
  <g transform="translate(860, 140)">
    <!-- Leaf midrib profile -->
    <path d="M 20 60 Q 110 50 200 60 Q 160 140 110 140 Q 60 140 20 60 Z" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Midrib vascular bundle -->
    <circle cx="110" cy="90" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 85 90 A 25 25 0 0 1 135 90 Z" class="xylem"/>
    <path d="M 85 90 A 25 25 0 0 0 135 90 Z" class="phloem"/>

    <text x="110" y="195" text-anchor="middle" class="head">3. Dicot Leaf (Vein)</text>
    <text x="110" y="215" text-anchor="middle" class="small">Xylem on UPPER side</text>
    <text x="110" y="230" text-anchor="middle" class="small">Phloem on LOWER side</text>
  </g>

  <!-- Bottom panel: Water uptake pathway and Transpiration (Core 8.2 & 8.3) -->
  <rect x="36" y="384" width="1128" height="310" rx="16" class="box"/>
  <text x="600" y="415" text-anchor="middle" class="head">Pathway of Water Through Plant &amp; Transpiration (Core 8.2 &amp; 8.3)</text>

  <!-- 4 Step Flow: Root hair -> Cortex -> Xylem -> Mesophyll & Stomata -->
  <g transform="translate(60, 440)">
    <!-- 1. Root Hair Cell -->
    <rect x="0" y="0" width="220" height="180" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Root hair protrusion shape -->
    <path d="M 50 70 L 15 70 Q 0 85 15 100 L 50 100 L 50 130 L 170 130 L 170 40 L 50 40 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="110" y="25" text-anchor="middle" class="label">1. Root Hair Cell</text>
    <text x="110" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">Large surface area</text>
    <text x="110" y="162" text-anchor="middle" class="small">Absorbs water (osmosis) &amp; ions</text>

    <!-- Arrow 1 -->
    <path d="M 230 90 L 270 90" stroke="#0284c7" stroke-width="3"/>
    <polygon points="270,84 282,90 270,96" fill="#0284c7"/>

    <!-- 2. Root Cortex Cells -->
    <rect x="290" y="0" width="220" height="180" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="360" cy="70" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="400" cy="70" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="440" cy="70" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="380" cy="105" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <circle cx="420" cy="105" r="22" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="400" y="25" text-anchor="middle" class="label">2. Root Cortex</text>
    <text x="400" y="150" text-anchor="middle" class="small">Water moves cell to cell</text>
    <text x="400" y="168" text-anchor="middle" class="small">across parenchyma cortex</text>

    <!-- Arrow 2 -->
    <path d="M 520 90 L 560 90" stroke="#0284c7" stroke-width="3"/>
    <polygon points="560,84 572,90 560,96" fill="#0284c7"/>

    <!-- 3. Xylem Vessels -->
    <rect x="580" y="0" width="220" height="180" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Hollow tube -->
    <rect x="650" y="45" width="80" height="85" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <path d="M 690 120 L 690 55" stroke="#dc2626" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="685,55 690,45 695,55" fill="#dc2626"/>
    <text x="690" y="25" text-anchor="middle" class="label">3. Stem Xylem</text>
    <text x="690" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Transpiration stream</text>
    <text x="690" y="168" text-anchor="middle" class="small">Upward flow of water &amp; ions</text>

    <!-- Arrow 3 -->
    <path d="M 810 90 L 850 90" stroke="#0284c7" stroke-width="3"/>
    <polygon points="850,84 862,90 850,96" fill="#0284c7"/>

    <!-- 4. Mesophyll & Stomata -->
    <rect x="870" y="0" width="220" height="180" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="940" cy="70" r="18" fill="#dcfce7" stroke="#16a34a"/>
    <circle cx="980" cy="70" r="18" fill="#dcfce7" stroke="#16a34a"/>
    <!-- Stoma pore -->
    <path d="M 945 115 Q 960 110 975 115" stroke="#1e293b" stroke-width="3"/>
    <path d="M 960 110 L 960 135" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="980" y="25" text-anchor="middle" class="label">4. Transpiration</text>
    <text x="980" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Evaporation &amp; Diffusion</text>
    <text x="980" y="168" text-anchor="middle" class="small">Diffuses out through stomata</text>
  </g>
</svg>