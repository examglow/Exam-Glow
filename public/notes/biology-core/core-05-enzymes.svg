<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Enzymes — Biological Catalysts and Mechanism</title>
  <desc id="desc">Enzyme-substrate lock and key mechanism, active site specificity, and the effect of temperature and pH on enzyme activity.</desc>
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#173128}.head{font:700 19px Arial,sans-serif;fill:#173128}.label{font:600 15px Arial,sans-serif;fill:#233831}.small{font:13px Arial,sans-serif;fill:#465a4d}.box{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}.line{stroke:#547365;stroke-width:2.5;fill:none}.arrow{fill:#547365}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="600" y="44" text-anchor="middle" class="title">Topic 5: Enzymes — Biological Catalysts &amp; Activity</text>

  <!-- Top panel: Lock and key mechanism -->
  <rect x="36" y="68" width="1128" height="310" rx="16" class="box"/>
  <text x="600" y="100" text-anchor="middle" class="head">The Lock and Key Mechanism of Enzyme Action</text>
  <text x="600" y="122" text-anchor="middle" class="small">Enzymes are proteins functioning as biological catalysts. The substrate has a complementary shape that fits into the active site.</text>

  <!-- Step 1: Enzyme and Substrate separated -->
  <g transform="translate(70, 140)">
    <!-- Substrate -->
    <path d="M 90 20 L 140 20 L 140 45 L 125 45 L 125 65 L 105 65 L 105 45 L 90 45 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="115" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">Substrate</text>
    
    <!-- Enzyme -->
    <path d="M 40 100 C 40 70 80 70 80 70 L 90 70 L 90 90 L 105 90 L 105 70 L 125 70 L 125 90 L 140 90 L 140 70 L 150 70 C 150 70 190 70 190 100 L 190 160 C 190 180 170 180 150 180 L 80 180 C 60 180 40 180 40 160 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="145" text-anchor="middle" class="head" fill="#1e3a8a">Enzyme</text>
    <text x="115" y="165" text-anchor="middle" class="small">Active site has complementary shape</text>
    <text x="115" y="205" text-anchor="middle" class="label">1. Enzyme + Substrate</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 330 220 L 375 220" class="line"/>
  <polygon points="375,214 388,220 375,226" class="arrow"/>

  <!-- Step 2: Enzyme-Substrate Complex -->
  <g transform="translate(420, 140)">
    <!-- Enzyme with substrate inserted -->
    <path d="M 40 100 C 40 70 80 70 80 70 L 90 70 L 90 90 L 105 90 L 105 70 L 125 70 L 125 90 L 140 90 L 140 70 L 150 70 C 150 70 190 70 190 100 L 190 160 C 190 180 170 180 150 180 L 80 180 C 60 180 40 180 40 160 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <!-- Substrate fitted in -->
    <path d="M 90 45 L 140 45 L 140 70 L 125 70 L 125 90 L 105 90 L 105 70 L 90 70 Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <text x="115" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">Substrate bound</text>
    <text x="115" y="145" text-anchor="middle" class="head" fill="#1e3a8a">Enzyme</text>
    <text x="115" y="205" text-anchor="middle" class="label">2. Enzyme-Substrate Complex</text>
    <text x="115" y="222" text-anchor="middle" class="small">Reaction catalyzed at active site</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 680 220 L 725 220" class="line"/>
  <polygon points="725,214 738,220 725,226" class="arrow"/>

  <!-- Step 3: Products released, Enzyme unchanged -->
  <g transform="translate(770, 140)">
    <!-- Two split product pieces -->
    <path d="M 85 20 L 110 20 L 110 45 L 85 45 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <text x="97" y="36" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">P1</text>
    <path d="M 120 20 L 145 20 L 145 45 L 120 45 Z" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    <text x="132" y="36" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">P2</text>

    <!-- Enzyme unchanged -->
    <path d="M 40 100 C 40 70 80 70 80 70 L 90 70 L 90 90 L 105 90 L 105 70 L 125 70 L 125 90 L 140 90 L 140 70 L 150 70 C 150 70 190 70 190 100 L 190 160 C 190 180 170 180 150 180 L 80 180 C 60 180 40 180 40 160 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="145" text-anchor="middle" class="head" fill="#1e3a8a">Enzyme</text>
    <text x="115" y="165" text-anchor="middle" class="small">Unchanged, ready for reuse</text>
    <text x="115" y="205" text-anchor="middle" class="label">3. Products Released</text>
  </g>

  <!-- Bottom Left: Effect of Temperature -->
  <rect x="36" y="394" width="548" height="300" rx="16" class="box"/>
  <text x="310" y="425" text-anchor="middle" class="head">Effect of Temperature on Enzyme Activity</text>
  <!-- Axes -->
  <path d="M 90 640 L 520 640" stroke="#374151" stroke-width="2"/>
  <path d="M 90 640 L 90 450" stroke="#374151" stroke-width="2"/>
  <text x="520" y="658" text-anchor="end" class="small">Temperature (°C)</text>
  <text x="80" y="450" text-anchor="end" class="small" transform="rotate(-90 80 450)">Rate of Reaction</text>

  <!-- Curve: smooth rise to optimum ~37-40C then steep drop to 0 at 60C -->
  <path d="M 100 635 Q 220 625 280 540 Q 320 460 340 460 Q 365 460 380 530 L 420 640" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <!-- Optimum line -->
  <path d="M 340 460 L 340 640" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="340" cy="460" r="5" fill="#dc2626"/>
  <text x="340" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Optimum Temp (~37°C)</text>
  <text x="210" y="580" class="small" fill="#1e40af">Kinetic energy increases</text>
  <text x="430" y="540" class="small" fill="#b91c1c">Denaturation:</text>
  <text x="430" y="558" class="small" fill="#b91c1c">Active site alters shape</text>

  <!-- Bottom Right: Effect of pH -->
  <rect x="616" y="394" width="548" height="300" rx="16" class="box"/>
  <text x="890" y="425" text-anchor="middle" class="head">Effect of pH on Enzyme Activity</text>
  <!-- Axes -->
  <path d="M 670 640 L 1100 640" stroke="#374151" stroke-width="2"/>
  <path d="M 670 640 L 670 450" stroke="#374151" stroke-width="2"/>
  <text x="1100" y="658" text-anchor="end" class="small">pH (1 to 14)</text>
  <text x="660" y="450" text-anchor="end" class="small" transform="rotate(-90 660 450)">Rate of Reaction</text>

  <!-- Pepsin curve (optimum pH 2) -->
  <path d="M 680 640 Q 730 460 750 460 Q 770 460 810 640" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="750" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">Pepsin (pH 2)</text>

  <!-- Salivary Amylase curve (optimum pH 7) -->
  <path d="M 810 640 Q 890 460 910 460 Q 930 460 980 640" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="910" y="450" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Amylase (pH 7)</text>

  <text x="890" y="570" text-anchor="middle" class="small">Away from optimum pH, the enzyme is denatured</text>
  <text x="890" y="590" text-anchor="middle" class="small">and substrate can no longer fit the active site</text>
</svg>