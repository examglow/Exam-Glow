<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Biological molecules</title>
  <desc id="desc">Labelled carbohydrate, lipid and protein structures with their elements, smaller units and main functions.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#173128}.head{font:700 23px Arial,sans-serif;fill:#173128}.label{font:600 16px Arial,sans-serif;fill:#233831}.small{font:15px Arial,sans-serif;fill:#465a4d}.panel{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}.bond{stroke:#547365;stroke-width:4}.lead{stroke:#547365;stroke-width:2;fill:none}</style></defs>
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="600" y="46" text-anchor="middle" class="title">Biological molecules: elements, units and functions</text>
  <g><rect x="30" y="82" width="360" height="590" rx="20" class="panel"/><text x="210" y="125" text-anchor="middle" class="head">Carbohydrate</text><text x="210" y="157" text-anchor="middle" class="label">Elements: C, H and O</text><text x="210" y="184" text-anchor="middle" class="small">Smaller unit: simple sugar (glucose)</text>
  <g fill="#e2edd9" stroke="#6f925b" stroke-width="3"><path d="M120 250l34-20 34 20v40l-34 20-34-20z"/><path d="M198 250l34-20 34 20v40l-34 20-34-20z"/><path d="M120 350l34-20 34 20v40l-34 20-34-20z"/><path d="M198 350l34-20 34 20v40l-34 20-34-20z"/></g>
  <g class="bond"><path d="M188 270h10M154 310v20M232 310v20"/></g>
  <text x="210" y="450" text-anchor="middle" class="label">Many glucose units</text><text x="210" y="477" text-anchor="middle" class="label">form a polysaccharide</text>
  <rect x="62" y="515" width="296" height="112" rx="12" fill="#fff" stroke="#b7c7b9"/>
  <text x="82" y="545" class="small">• Glucose — respiration</text><text x="82" y="572" class="small">• Starch / glycogen — storage</text><text x="82" y="599" class="small">• Cellulose — plant cell walls</text></g>
  <g><rect x="420" y="82" width="360" height="590" rx="20" class="panel"/><text x="600" y="125" text-anchor="middle" class="head">Lipid (fat or oil)</text><text x="600" y="157" text-anchor="middle" class="label">Elements: C, H and O</text><text x="600" y="184" text-anchor="middle" class="small">Smaller units: glycerol + fatty acids</text>
  <rect x="568" y="235" width="64" height="105" rx="16" fill="#e8d9b9" stroke="#a3834f" stroke-width="3"/>
  <text x="600" y="294" text-anchor="middle" class="label">Glycerol</text>
  <g stroke="#b58b52" stroke-width="10" stroke-linecap="round" fill="none"><path d="M520 245C475 270 490 340 450 380"/><path d="M600 235C575 290 610 345 580 405"/><path d="M680 245C725 270 710 340 750 380"/></g>
  <g class="lead"><path d="M470 340L455 420H445"/><path d="M600 235V215"/><path d="M730 340L745 420H755"/></g>
  <text x="600" y="450" text-anchor="middle" class="label">Three fatty-acid chains</text>
  <rect x="452" y="515" width="296" height="112" rx="12" fill="#fff" stroke="#b7c7b9"/>
  <text x="472" y="545" class="small">• Concentrated energy store</text><text x="472" y="572" class="small">• Insulation and waterproofing</text><text x="472" y="599" class="small">• Insoluble in water</text></g>
  <g><rect x="810" y="82" width="360" height="590" rx="20" class="panel"/><text x="990" y="125" text-anchor="middle" class="head">Protein</text><text x="990" y="157" text-anchor="middle" class="label">Elements: C, H, O and N</text><text x="990" y="184" text-anchor="middle" class="small">Smaller units: amino acids</text>
  <path d="M875 250C925 200 965 310 1010 250C1050 195 1110 285 1080 330C1040 390 950 300 900 355C860 400 900 445 960 410C1020 375 1110 405 1090 455" fill="none" stroke="#8a719f" stroke-width="7"/>
  <g fill="#e6dcf0" stroke="#806497" stroke-width="3"><circle cx="875" cy="250" r="17"/><circle cx="930" cy="245" r="17"/><circle cx="985" cy="275" r="17"/><circle cx="1040" cy="245" r="17"/><circle cx="1080" cy="330" r="17"/><circle cx="1015" cy="345" r="17"/><circle cx="945" cy="340" r="17"/><circle cx="900" cy="390" r="17"/><circle cx="960" cy="410" r="17"/><circle cx="1030" cy="405" r="17"/><circle cx="1090" cy="455" r="17"/></g>
  <text x="990" y="490" text-anchor="middle" class="label">Amino-acid chain folds</text><text x="990" y="514" text-anchor="middle" class="label">into a specific 3D shape</text>
  <rect x="842" y="535" width="296" height="92" rx="12" fill="#fff" stroke="#b7c7b9"/>
  <text x="862" y="565" class="small">• Enzymes, antibodies, haemoglobin</text><text x="862" y="592" class="small">• Growth, repair and structure</text><text x="862" y="617" class="small">• Some proteins also contain sulfur</text></g>
</svg>
