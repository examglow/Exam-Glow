<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Human Nutrition — Digestive System and Teeth</title>
  <desc id="desc">Alimentary canal organs, functions of ingestion, digestion, absorption, assimilation, egestion, and human tooth anatomy.</desc>
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#173128}.head{font:700 18px Arial,sans-serif;fill:#173128}.label{font:600 14px Arial,sans-serif;fill:#233831}.small{font:12px Arial,sans-serif;fill:#465a4d}.box{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}.line{stroke:#547365;stroke-width:2;fill:none}.tooth{fill:#ffffff;stroke:#4b5563;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="600" y="44" text-anchor="middle" class="title">Topic 7: Human Nutrition — Digestive System &amp; Teeth</text>

  <!-- Left Panel: Alimentary canal & Digestive Organs -->
  <rect x="36" y="68" width="560" height="626" rx="16" class="box"/>
  <text x="316" y="100" text-anchor="middle" class="head">The Alimentary Canal &amp; Associated Organs</text>

  <!-- Diagrammatic Alimentary Canal Flow -->
  <g transform="translate(60, 120)">
    <!-- 1. Mouth & Salivary Glands -->
    <rect x="20" y="0" width="220" height="42" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
    <text x="130" y="26" text-anchor="middle" class="label">Mouth &amp; Salivary Glands</text>
    <text x="260" y="26" class="small">Ingestion · Physical chewing · Amylase</text>

    <!-- arrow down -->
    <path d="M 130 42 L 130 65" stroke="#64748b" stroke-width="2"/>

    <!-- 2. Oesophagus -->
    <rect x="40" y="65" width="180" height="36" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="130" y="88" text-anchor="middle" class="label">Oesophagus</text>
    <text x="260" y="88" class="small">Bolus passes by peristalsis</text>

    <!-- arrow down -->
    <path d="M 130 101 L 130 125" stroke="#64748b" stroke-width="2"/>

    <!-- 3. Stomach -->
    <rect x="20" y="125" width="220" height="46" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="130" y="152" text-anchor="middle" class="label">Stomach</text>
    <text x="260" y="145" class="small">Physical churning · Gastric juice</text>
    <text x="260" y="162" class="small">HCl kills pathogens · Protease (pH 2)</text>

    <!-- arrow down -->
    <path d="M 130 171 L 130 200" stroke="#64748b" stroke-width="2"/>

    <!-- Associated Organs: Liver, Gall bladder, Pancreas -->
    <g transform="translate(0, 200)">
      <rect x="10" y="0" width="115" height="50" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="67" y="22" text-anchor="middle" class="label">Liver &amp;</text>
      <text x="67" y="38" text-anchor="middle" class="label">Gall bladder</text>
      <text x="67" y="65" text-anchor="middle" font-size="10" fill="#9a3412">Bile production</text>

      <rect x="145" y="0" width="115" height="50" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <text x="202" y="22" text-anchor="middle" class="label">Pancreas</text>
      <text x="202" y="38" text-anchor="middle" class="small">Secretes enzymes</text>
      <text x="202" y="65" text-anchor="middle" font-size="10" fill="#9a3412">Amylase, Protease, Lipase</text>
    </g>

    <!-- arrow down -->
    <path d="M 130 270 L 130 295" stroke="#64748b" stroke-width="2"/>

    <!-- 4. Small Intestine -->
    <rect x="10" y="295" width="240" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="320" text-anchor="middle" class="label">Small Intestine</text>
    <text x="130" y="338" text-anchor="middle" font-size="11" fill="#15803d">(Duodenum &amp; Ileum)</text>
    <text x="265" y="316" class="small">Main site of nutrient absorption</text>
    <text x="265" y="334" class="small">Most water absorbed here</text>

    <!-- arrow down -->
    <path d="M 130 351 L 130 375" stroke="#64748b" stroke-width="2"/>

    <!-- 5. Large Intestine -->
    <rect x="10" y="375" width="240" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="130" y="400" text-anchor="middle" class="label">Large Intestine</text>
    <text x="130" y="418" text-anchor="middle" font-size="11" fill="#0369a1">(Colon, Rectum, Anus)</text>
    <text x="265" y="396" class="small">Remaining water absorbed (colon)</text>
    <text x="265" y="414" class="small">Faeces stored in rectum · Egested at anus</text>

    <!-- Five stages summary -->
    <rect x="10" y="450" width="480" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="250" y="476" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">
      Ingestion ➔ Digestion ➔ Absorption ➔ Assimilation ➔ Egestion
    </text>
  </g>

  <!-- Right Panel Top: Structure of a Human Tooth -->
  <rect x="620" y="68" width="544" height="340" rx="16" class="box"/>
  <text x="892" y="100" text-anchor="middle" class="head">Structure of a Human Tooth (Core 7.3.4)</text>

  <!-- Tooth Drawing -->
  <g transform="translate(660, 120)">
    <!-- Gum line -->
    <rect x="0" y="80" width="220" height="150" fill="#fecdd3" opacity="0.6"/>
    <text x="10" y="160" font-size="12" font-weight="bold" fill="#e11d48">Gums</text>
    <!-- Bone -->
    <rect x="0" y="120" width="220" height="110" fill="#f5d0fe" opacity="0.4"/>
    <text x="10" y="210" font-size="12" font-weight="bold" fill="#a21caf">Jawbone</text>

    <!-- Crown & Root layers -->
    <!-- Enamel outer crown -->
    <path d="M 50 80 C 50 20 80 15 110 15 C 140 15 170 20 170 80 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <!-- Dentine -->
    <path d="M 62 80 C 62 35 85 30 110 30 C 135 30 158 35 158 80 L 145 190 L 125 195 L 110 100 L 95 195 L 75 190 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Pulp cavity -->
    <path d="M 85 80 C 85 55 95 50 110 50 C 125 50 135 55 135 80 L 130 170 L 120 170 L 110 85 L 100 170 L 90 170 Z" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
    <!-- Cement layer on root -->
    <path d="M 58 80 L 73 192 M 162 80 L 147 192" stroke="#ea580c" stroke-width="3"/>

    <!-- Labels with pointer lines -->
    <!-- Enamel -->
    <line x1="165" y1="40" x2="260" y2="40" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="44" class="label">Enamel</text>
    <text x="265" y="60" class="small">Hardest outer surface</text>

    <!-- Dentine -->
    <line x1="150" y1="90" x2="260" y2="90" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="94" class="label">Dentine</text>
    <text x="265" y="110" class="small">Bone-like structure</text>

    <!-- Pulp cavity -->
    <line x1="120" y1="130" x2="260" y2="130" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="134" class="label">Pulp Cavity</text>
    <text x="265" y="150" class="small">Nerves &amp; blood vessels</text>

    <!-- Cement -->
    <line x1="155" y1="175" x2="260" y2="175" stroke="#475569" stroke-width="1.5"/>
    <text x="265" y="179" class="label">Cement</text>
    <text x="265" y="195" class="small">Anchors tooth into jawbone</text>
  </g>

  <!-- Right Panel Bottom: The 4 Types of Teeth -->
  <rect x="620" y="424" width="544" height="270" rx="16" class="box"/>
  <text x="892" y="456" text-anchor="middle" class="head">The Four Types of Human Teeth (Core 7.3.3 &amp; 7.3.5)</text>

  <g transform="translate(640, 480)">
    <!-- 1. Incisor -->
    <rect x="0" y="0" width="120" height="190" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 45 60 L 75 60 L 75 25 L 45 25 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="60" y="90" text-anchor="middle" class="label">Incisor</text>
    <text x="60" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Chisel-shaped</text>
    <text x="60" y="140" text-anchor="middle" class="small">Biting &amp; cutting</text>
    <text x="60" y="158" text-anchor="middle" class="small">food pieces</text>

    <!-- 2. Canine -->
    <rect x="135" y="0" width="120" height="190" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 45 60 L 75 60 L 60 20 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2" transform="translate(135, 0)"/>
    <text x="195" y="90" text-anchor="middle" class="label">Canine</text>
    <text x="195" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Pointed shape</text>
    <text x="195" y="140" text-anchor="middle" class="small">Piercing &amp; tearing</text>
    <text x="195" y="158" text-anchor="middle" class="small">tough food</text>

    <!-- 3. Premolar -->
    <rect x="270" y="0" width="120" height="190" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 40 60 L 80 60 L 80 30 L 68 25 L 60 30 L 52 25 L 40 30 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2" transform="translate(270, 0)"/>
    <text x="330" y="90" text-anchor="middle" class="label">Premolar</text>
    <text x="330" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">2 cusps on top</text>
    <text x="330" y="140" text-anchor="middle" class="small">Chewing &amp; crushing</text>
    <text x="330" y="158" text-anchor="middle" class="small">food into pieces</text>

    <!-- 4. Molar -->
    <rect x="405" y="0" width="120" height="190" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 35 60 L 85 60 L 85 30 L 73 24 L 60 28 L 47 24 L 35 30 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2" transform="translate(405, 0)"/>
    <text x="465" y="90" text-anchor="middle" class="label">Molar</text>
    <text x="465" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Broad, 4-5 cusps</text>
    <text x="465" y="140" text-anchor="middle" class="small">Grinding food to</text>
    <text x="465" y="158" text-anchor="middle" class="small">increase surface area</text>
  </g>
</svg>