<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transport in Animals — Heart, Blood Vessels and Blood Components</title>
  <desc id="desc">Internal structure of mammalian heart with chambers and valves, comparison of arteries, veins and capillaries, and functions of red cells, white cells, platelets and plasma.</desc>
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#173128}.head{font:700 18px Arial,sans-serif;fill:#173128}.label{font:600 14px Arial,sans-serif;fill:#233831}.small{font:12px Arial,sans-serif;fill:#465a4d}.box{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}.line{stroke:#547365;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fffefb"/>
  <text x="600" y="44" text-anchor="middle" class="title">Topic 9: Transport in Animals — Heart &amp; Circulation</text>

  <!-- Left panel: Mammalian Heart Internal Anatomy (Core 9.2.1) -->
  <rect x="36" y="68" width="580" height="626" rx="16" class="box"/>
  <text x="326" y="100" text-anchor="middle" class="head">Internal Anatomy of the Mammalian Heart (Core 9.2.1)</text>

  <!-- Heart diagram -->
  <g transform="translate(80, 120)">
    <!-- Main heart muscle outline -->
    <path d="M 120 70 C 60 70 40 140 40 240 C 40 370 200 460 250 490 C 300 460 460 370 460 240 C 460 140 440 70 380 70 C 320 70 280 110 250 130 C 220 110 180 70 120 70 Z" fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>

    <!-- Central Septum separating left and right sides -->
    <path d="M 235 150 L 235 480 L 265 480 L 265 150 Z" fill="#fda4af" stroke="#be123c" stroke-width="2"/>
    <text x="250" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#881337" transform="rotate(-90 250 320)">Septum (wall)</text>

    <!-- Right Atrium (left side of diagram) -->
    <rect x="70" y="140" width="140" height="90" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="180" text-anchor="middle" class="head" fill="#1e40af">Right Atrium</text>
    <text x="140" y="202" text-anchor="middle" font-size="11" fill="#1e40af">(deoxygenated from Vena Cava)</text>

    <!-- Tricuspid Valve -->
    <path d="M 110 230 L 140 250 L 170 230" stroke="#1d4ed8" stroke-width="4" fill="none"/>
    <text x="140" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Atrioventricular valve</text>

    <!-- Right Ventricle -->
    <rect x="70" y="280" width="140" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="335" text-anchor="middle" class="head" fill="#1e40af">Right Ventricle</text>
    <text x="140" y="358" text-anchor="middle" font-size="11" fill="#1e40af">Pumps to lungs via</text>
    <text x="140" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">Pulmonary Artery</text>

    <!-- Left Atrium (right side of diagram) -->
    <rect x="290" y="140" width="140" height="90" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="360" y="180" text-anchor="middle" class="head" fill="#b91c1c">Left Atrium</text>
    <text x="360" y="202" text-anchor="middle" font-size="11" fill="#b91c1c">(oxygenated from Pulm. Vein)</text>

    <!-- Bicuspid Valve -->
    <path d="M 330 230 L 360 250 L 390 230" stroke="#b91c1c" stroke-width="4" fill="none"/>
    <text x="360" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">Atrioventricular valve</text>

    <!-- Left Ventricle (very thick muscular wall) -->
    <rect x="290" y="280" width="140" height="120" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="360" y="335" text-anchor="middle" class="head" fill="#b91c1c">Left Ventricle</text>
    <text x="360" y="358" text-anchor="middle" font-size="11" fill="#b91c1c">Thick muscular wall</text>
    <text x="360" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">Pumps to body via Aorta</text>

    <!-- Coronary Arteries on outer wall -->
    <path d="M 230 430 Q 210 460 170 450 M 270 430 Q 300 460 340 450" stroke="#dc2626" stroke-width="3" fill="none"/>
    <text x="250" y="525" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">Coronary Arteries (supply heart muscle)</text>
  </g>

  <!-- Right panel Top: Blood Vessels Comparison (Core 9.3) -->
  <rect x="636" y="68" width="528" height="300" rx="16" class="box"/>
  <text x="900" y="100" text-anchor="middle" class="head">Blood Vessels: Artery, Vein &amp; Capillary (Core 9.3)</text>

  <g transform="translate(660, 125)">
    <!-- Artery -->
    <rect x="0" y="0" width="150" height="220" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="75" cy="65" r="45" fill="#fecaca" stroke="#dc2626" stroke-width="12"/>
    <circle cx="75" cy="65" r="22" fill="#fff"/>
    <text x="75" y="130" text-anchor="middle" class="label">Artery</text>
    <text x="75" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">Thick wall · Narrow lumen</text>
    <text x="75" y="172" text-anchor="middle" class="small">High blood pressure</text>
    <text x="75" y="190" text-anchor="middle" class="small">Away from heart</text>
    <text x="75" y="206" text-anchor="middle" class="small">No valves (high press.)</text>

    <!-- Vein -->
    <rect x="175" y="0" width="150" height="220" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="250" cy="65" r="45" fill="#bfdbfe" stroke="#2563eb" stroke-width="5"/>
    <circle cx="250" cy="65" r="38" fill="#fff"/>
    <!-- Valve flap in vein -->
    <path d="M 235 60 L 250 72 L 265 60" stroke="#2563eb" stroke-width="3" fill="none"/>
    <text x="250" y="130" text-anchor="middle" class="label">Vein</text>
    <text x="250" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">Thinner wall · Wide lumen</text>
    <text x="250" y="172" text-anchor="middle" class="small">Low blood pressure</text>
    <text x="250" y="190" text-anchor="middle" class="small">Returns to heart</text>
    <text x="250" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">Valves prevent backflow</text>

    <!-- Capillary -->
    <rect x="350" y="0" width="135" height="220" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="417" cy="65" r="16" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="417" cy="65" r="13" fill="#fff"/>
    <text x="417" y="130" text-anchor="middle" class="label">Capillary</text>
    <text x="417" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#ca8a04">One cell thick wall</text>
    <text x="417" y="172" text-anchor="middle" class="small">Extremely narrow</text>
    <text x="417" y="190" text-anchor="middle" class="small">Permeable walls for</text>
    <text x="417" y="206" text-anchor="middle" class="small">rapid exchange</text>
  </g>

  <!-- Right panel Bottom: Components of Blood (Core 9.4) -->
  <rect x="636" y="384" width="528" height="310" rx="16" class="box"/>
  <text x="900" y="415" text-anchor="middle" class="head">The Four Components of Blood (Core 9.4)</text>

  <g transform="translate(660, 440)">
    <!-- Red blood cells -->
    <rect x="0" y="0" width="115" height="230" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="57" cy="50" r="28" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="57" cy="50" r="14" fill="#f87171"/>
    <text x="57" y="105" text-anchor="middle" class="label">Red Blood Cells</text>
    <text x="57" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b91c1c">Haemoglobin</text>
    <text x="57" y="150" text-anchor="middle" class="small">Biconcave disc</text>
    <text x="57" y="170" text-anchor="middle" class="small">No nucleus</text>
    <text x="57" y="190" text-anchor="middle" class="small">Transports O₂</text>
    <text x="57" y="210" text-anchor="middle" class="small">around body</text>

    <!-- White blood cells -->
    <rect x="125" y="0" width="115" height="230" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="182" cy="50" r="28" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <path d="M 172 40 Q 182 30 192 40 Q 200 55 190 65 Q 180 60 170 50 Z" fill="#64748b"/>
    <text x="182" y="105" text-anchor="middle" class="label">White Blood Cells</text>
    <text x="182" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">Immune Defence</text>
    <text x="182" y="150" text-anchor="middle" class="small">Phagocytosis</text>
    <text x="182" y="170" text-anchor="middle" class="small">(engulfs microbes)</text>
    <text x="182" y="190" text-anchor="middle" class="small">&amp; Antibody</text>
    <text x="182" y="210" text-anchor="middle" class="small">production</text>

    <!-- Platelets -->
    <rect x="250" y="0" width="115" height="230" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="300,40 315,35 320,50 310,60 295,50" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <polygon points="285,55 295,50 300,65 285,62" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="307" y="105" text-anchor="middle" class="label">Platelets</text>
    <text x="307" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">Blood Clotting</text>
    <text x="307" y="150" text-anchor="middle" class="small">Cell fragments</text>
    <text x="307" y="170" text-anchor="middle" class="small">Forms fibrin mesh</text>
    <text x="307" y="190" text-anchor="middle" class="small">Prevents blood loss</text>
    <text x="307" y="210" text-anchor="middle" class="small">&amp; pathogen entry</text>

    <!-- Plasma -->
    <rect x="375" y="0" width="115" height="230" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="395" y="30" width="75" height="40" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
    <text x="432" y="55" text-anchor="middle" font-size="18">💧</text>
    <text x="432" y="105" text-anchor="middle" class="label">Plasma</text>
    <text x="432" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e">Liquid Medium</text>
    <text x="432" y="150" text-anchor="middle" class="small">Transports cells,</text>
    <text x="432" y="170" text-anchor="middle" class="small">nutrients (glucose),</text>
    <text x="432" y="190" text-anchor="middle" class="small">ions, urea, CO₂ &amp;</text>
    <text x="432" y="210" text-anchor="middle" class="small">hormones</text>
  </g>
</svg>