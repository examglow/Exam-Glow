<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Plant, animal and bacterial cells</title>
  <desc id="desc">A labelled plant cell, animal cell and bacterial cell with shared and distinguishing structures.</desc>
  <defs><style>.title{font:700 30px Arial,sans-serif;fill:#173128}.head{font:700 21px Arial,sans-serif;fill:#173128}.label{font:600 15px Arial,sans-serif;fill:#233831}.small{font:14px Arial,sans-serif;fill:#465a4d}.lead{stroke:#547365;stroke-width:2;fill:none}.panel{fill:#f7f8f4;stroke:#b7c7b9;stroke-width:2}</style></defs>
  <rect width="1200" height="760" fill="#fffefb"/>
  <text x="600" y="45" text-anchor="middle" class="title">Cell structure: plant, animal and bacterial cells</text>
  <rect x="30" y="78" width="555" height="640" rx="20" class="panel"/>
  <text x="307" y="115" text-anchor="middle" class="head">Generalised plant cell</text>
  <rect x="178" y="155" width="255" height="385" rx="76" fill="#e0edd6" stroke="#688653" stroke-width="12"/>
  <rect x="192" y="169" width="227" height="357" rx="64" fill="#f4f8e9" stroke="#91ad75" stroke-width="3"/>
  <ellipse cx="307" cy="390" rx="79" ry="118" fill="#dcecf0" stroke="#6a9baa" stroke-width="3"/>
  <circle cx="268" cy="235" r="42" fill="#d9cee8" stroke="#7b659b" stroke-width="3"/>
  <g fill="#79a85d" stroke="#456b3d" stroke-width="2"><ellipse cx="370" cy="222" rx="28" ry="14"/><ellipse cx="370" cy="275" rx="28" ry="14"/><ellipse cx="232" cy="492" rx="28" ry="14"/><ellipse cx="384" cy="487" rx="28" ry="14"/></g>
  <g fill="#d8a578" stroke="#986744" stroke-width="2"><ellipse cx="230" cy="330" rx="20" ry="10"/><ellipse cx="389" cy="340" rx="20" ry="10"/></g>
  <g class="lead"><path d="M178 160L90 145H55"/><path d="M192 180L100 190H55"/><path d="M268 235L100 250H55"/><path d="M370 222L480 180H550"/><path d="M390 340L485 310H550"/><path d="M307 390L485 390H550"/><path d="M307 495L480 515H550"/><path d="M419 460L485 565H550"/></g>
  <g class="label"><text x="55" y="136">Cell wall — cellulose</text><text x="55" y="182">Cell membrane</text><text x="55" y="242">Nucleus</text><text x="550" y="171" text-anchor="end">Chloroplasts</text><text x="550" y="301" text-anchor="end">Mitochondrion</text><text x="550" y="381" text-anchor="end">Permanent vacuole</text><text x="550" y="506" text-anchor="end">Cell sap</text><text x="550" y="556" text-anchor="end">Cytoplasm</text></g>
  <text x="307" y="590" text-anchor="middle" class="small">Small dots in the cytoplasm represent ribosomes</text>
  <text x="307" y="615" text-anchor="middle" class="small">Ribosomes are the sites of protein synthesis</text>
  <rect x="615" y="78" width="555" height="295" rx="20" class="panel"/>
  <text x="892" y="115" text-anchor="middle" class="head">Generalised animal cell</text>
  <path d="M770 164C822 129 947 141 1005 190C1055 233 1028 301 953 319C877 338 753 310 735 245C725 210 742 183 770 164Z" fill="#f4e6d6" stroke="#b68766" stroke-width="4"/>
  <circle cx="860" cy="230" r="39" fill="#d9cee8" stroke="#7b659b" stroke-width="3"/>
  <g fill="#d8a578" stroke="#986744" stroke-width="2"><ellipse cx="960" cy="220" rx="22" ry="11"/><ellipse cx="800" cy="275" rx="22" ry="11"/></g>
  <g class="lead"><path d="M735 245L655 260H630"/><path d="M860 230L690 165H630"/><path d="M960 220L1080 175H1140"/><path d="M800 275L1080 285H1140"/></g>
  <g class="label"><text x="630" y="251">Cell membrane</text><text x="630" y="156">Nucleus</text><text x="1140" y="166" text-anchor="end">Mitochondrion</text><text x="1140" y="276" text-anchor="end">Cytoplasm + ribosomes</text></g>
  <text x="892" y="350" text-anchor="middle" class="small">No cellulose wall, chloroplasts or permanent vacuole</text>
  <rect x="615" y="403" width="555" height="315" rx="20" class="panel"/>
  <text x="892" y="440" text-anchor="middle" class="head">Generalised bacterial cell</text>
  <rect x="730" y="480" width="320" height="150" rx="75" fill="#e8e0f0" stroke="#8a719f" stroke-width="9"/>
  <rect x="741" y="491" width="298" height="128" rx="64" fill="#f7f2fa" stroke="#b6a2c5" stroke-width="3"/>
  <path d="M800 555C820 505 880 610 915 535C940 490 980 555 950 580C920 606 860 510 830 575" fill="none" stroke="#72528b" stroke-width="5"/>
  <ellipse cx="980" cy="520" rx="22" ry="12" fill="none" stroke="#bf8d43" stroke-width="4"/>
  <g fill="#7b659b"><circle cx="780" cy="525" r="4"/><circle cx="790" cy="590" r="4"/><circle cx="1000" cy="580" r="4"/><circle cx="960" cy="595" r="4"/><circle cx="760" cy="560" r="4"/></g>
  <g class="lead"><path d="M730 500L665 480H630"/><path d="M741 510L670 535H630"/><path d="M850 550L680 610H630"/><path d="M980 520L1080 475H1140"/><path d="M1000 580L1080 610H1140"/></g>
  <g class="label"><text x="630" y="471">Cell wall</text><text x="630" y="526">Cell membrane</text><text x="630" y="601">Circular DNA</text><text x="1140" y="466" text-anchor="end">Plasmid</text><text x="1140" y="601" text-anchor="end">Ribosomes</text></g>
  <text x="892" y="675" text-anchor="middle" class="small">No nucleus: DNA lies free in the cytoplasm</text>
</svg>
